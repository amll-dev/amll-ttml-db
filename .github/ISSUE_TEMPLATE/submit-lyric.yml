name: 提交/补正歌词
description: 我想提交/补正一个歌曲的 TTML 歌词文件！
title: "[歌词提交/补正] "
labels: ["歌词提交/补正"]
assignees:
  - Steve-xmh
body:
  - type: markdown
    attributes:
      value: |
        本模板是普通歌词新增、补正的指定投稿入口。提交后由 GitHub Actions 校验、规范化歌词并生成 PR，不接受手动创建的普通歌词 PR。完整准入规则见[贡献指南](https://github.com/amll-dev/amll-ttml-db/blob/main/CONTRIBUTING.md)。
        标题中的 `歌词提交/补正` 请根据实际内容改为 `歌词提交` 或 `歌词补正`，并填写类似 `艺术家 - 歌曲名` 的歌曲信息，以便审核。
        上传前请阅读[Wiki 投稿要求](https://github.com/amll-dev/amll-ttml-db/wiki/%E4%B8%8A%E4%BC%A0%E6%AD%8C%E8%AF%8D)，确认歌词内容和格式符合要求。

  - type: input
    id: ttml-download-url
    attributes:
      label: TTML 歌词文件下载直链
      description: |
        GitHub Actions 将下载该链接指向的 TTML，校验并规范化后生成待审核 PR；输入原文会在 Issue 评论中留存。
        链接不可访问或文件有误时，Issue 会被关闭，请按机器人反馈修正后重新投稿。
    validations:
      required: true

  - type: dropdown
    id: upload-reason
    attributes:
      label: 提交缘由
      description: 是一首新歌曲的歌词呢？还是原来的歌词有疏漏或者错误呢？
      options:
        - 新歌词提交
        - 修正已有歌词
    validations:
      required: true

  - type: checkboxes
    id: read-wiki
    attributes:
      label: 请确认以下事项：
      options:
        - label: 我已阅读[贡献指南](https://github.com/amll-dev/amll-ttml-db/blob/main/CONTRIBUTING.md)和[Wiki 投稿要求](https://github.com/amll-dev/amll-ttml-db/wiki/%E4%B8%8A%E4%BC%A0%E6%AD%8C%E8%AF%8D)，并了解投稿规范
          required: true

  - type: textarea
    id: comment
    attributes:
      label: 备注
      placeholder: |
        原投稿 PR 链接：
        修改原因与修正点：
      description: |
        补正已有歌词，或从旧 PR 重新投稿时，请引用原 PR 并说明修改原因，方便审核人员迁移已有审核信息。
        若歌曲因特殊原因无法直接播放或获取，请提供准确的音源下载链接，方便审核。
    validations:
      required: false
