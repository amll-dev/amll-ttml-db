name: 提交/补正歌词
description: 我想提交/补正一个歌曲的 TTML 歌词文件！
title: "[歌词提交/补正] "
labels: ["歌词提交/补正"]
assignees:
  - Steve-xmh
body:
  - type: markdown
    attributes:
      value: |
        标题中的 `歌词提交/补正` 请根据实际内容改为 `歌词提交` 或 `歌词补正`，并填写类似 `艺术家 - 歌曲名` 的歌曲信息，以便审核。

  - type: input
    id: ttml-download-url
    attributes:
      label: TTML 歌词文件下载直链
      description: |
        GitHub Actions 将下载该链接指向的 TTML，校验并规范化后生成待审核 PR；输入原文会在 Issue 评论中留存。
        链接不可访问或文件格式有误时，Issue 会被关闭，请按机器人反馈修正后重新投稿。
    validations:
      required: true

  - type: dropdown
    id: upload-reason
    attributes:
      label: 提交缘由
      description: 是一首新歌曲的歌词呢？还是原来的歌词有疏漏或者错误呢？
      options:
        - 新歌词提交
        - 修正已有歌词
    validations:
      required: true

  - type: checkboxes
    id: read-wiki
    attributes:
      label: 请确认以下事项：
      options:
        - label: 我已阅读[贡献指南](https://github.com/amll-dev/amll-ttml-db/blob/main/CONTRIBUTING.md)和[Wiki 投稿要求](https://github.com/amll-dev/amll-ttml-db/wiki/%E4%B8%8A%E4%BC%A0%E6%AD%8C%E8%AF%8D)
          required: true

  - type: textarea
    id: comment
    attributes:
      label: 备注
      placeholder: |
        如果是修正已有歌词，请尽量按以下格式补充修正说明：
        对 #原投稿 PR 编号 的修正：
        - 修正点 1
        - 修正点 2
        - 修正点 3
        ...
      description: |
        补正已有歌词，或从旧 PR 重新投稿时，请引用原 PR 并说明修改原因，方便审核人员参考已有审核信息。
        如果你所提交的歌曲中包含因特殊原因无法直接播放或获取的歌曲，建议提供一个音源下载链接，音质不做要求但是必须准确以方便审核。
    validations:
      required: false
